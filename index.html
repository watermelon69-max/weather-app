<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <!-- Search Box -->
        <div class="search">
            <input 
                type="text" 
                class="city-input"
                placeholder="Enter city name"
                autocomplete="off"
            >

            <button id="btn">
                <img src="search.png" alt="Search">
            </button>
        </div>

        <!-- Weather Info -->
        <div class="weather">
            <img src="images/clear.png" class="weather-icon" alt="Weather Icon">

            <h1 class="temp">--°c</h1>
            <h2 class="city">City</h2>

            <div class="details">

                <div class="col1">
                    <img src="humidity.png" alt="Humidity">
                    <div>
                        <p class="humidity">--%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col1">
                    <img src="wind.png" alt="Wind">
                    <div>
                        <p class="wind-speed">-- km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
